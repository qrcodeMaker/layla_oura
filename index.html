<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11100d" />
  <meta name="description" content="Layla Aura official links" />
  <title>Layla Aura | Official Links</title>

  <style>
    :root {
      --bg-1: #0d0c0a;
      --bg-2: #19150d;
      --gold: #d8b55b;
      --gold-soft: #f2df9c;
      --text: #fffaf0;
      --muted: #bdb6a6;
      --card: rgba(255,255,255,.07);
      --card-hover: rgba(216,181,91,.14);
      --line: rgba(242,223,156,.24);
      --shadow: 0 22px 70px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(216,181,91,.11), transparent 34%),
        radial-gradient(circle at 85% 20%, rgba(242,223,156,.07), transparent 25%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow-x: hidden;
    }

    .shell {
      width: min(100%, 430px);
      position: relative;
    }

    .glow {
      position: absolute;
      inset: -60px -35px auto;
      height: 250px;
      background: radial-gradient(circle, rgba(216,181,91,.18), transparent 62%);
      filter: blur(16px);
      pointer-events: none;
    }

    .card {
      position: relative;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 32px;
      padding: 32px 22px 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(242,223,156,.06), transparent 34%, transparent 70%, rgba(216,181,91,.05));
      pointer-events: none;
    }

    .brand {
      position: relative;
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-wrap {
      width: 148px;
      height: 148px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 8px;
      background:
        linear-gradient(#11100d, #11100d) padding-box,
        linear-gradient(135deg, var(--gold-soft), #8d6a24, var(--gold-soft)) border-box;
      border: 1.5px solid transparent;
      box-shadow:
        0 0 0 8px rgba(216,181,91,.035),
        0 14px 40px rgba(0,0,0,.35);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #fff;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(31px, 7vw, 40px);
      letter-spacing: .06em;
      color: var(--gold-soft);
      text-shadow: 0 3px 25px rgba(216,181,91,.1);
    }

    .subtitle {
      margin: 8px auto 0;
      max-width: 320px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: .03em;
    }

    .divider {
      width: 58px;
      height: 1px;
      margin: 20px auto 22px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .links {
      display: grid;
      gap: 13px;
      position: relative;
    }

    .link {
      min-height: 64px;
      display: grid;
      grid-template-columns: 44px 1fr 24px;
      align-items: center;
      gap: 12px;
      padding: 10px 15px 10px 11px;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      transition: transform .22s ease, background .22s ease, border-color .22s ease, box-shadow .22s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(242,223,156,.48);
      box-shadow: 0 12px 30px rgba(0,0,0,.22);
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(242,223,156,.16), rgba(216,181,91,.07));
      border: 1px solid rgba(242,223,156,.18);
    }

    .icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--gold-soft);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy {
      min-width: 0;
    }

    .title {
      font-weight: 650;
      font-size: 15px;
      letter-spacing: .01em;
    }

    .hint {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow {
      color: var(--gold-soft);
      font-size: 20px;
      transform: translateX(0);
      transition: transform .22s ease;
    }

    .link:hover .arrow {
      transform: translateX(3px);
    }

    .footer {
      position: relative;
      margin-top: 22px;
      text-align: center;
      color: #8f897e;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    @media (max-width: 390px) {
      .card { padding: 27px 16px 20px; border-radius: 26px; }
      .logo-wrap { width: 128px; height: 128px; }
      .link { grid-template-columns: 42px 1fr 20px; padding-right: 12px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .card {
        animation: reveal .65s cubic-bezier(.2,.8,.2,1) both;
      }
      .link {
        animation: rise .5s ease both;
      }
      .link:nth-child(2) { animation-delay: .07s; }
      .link:nth-child(3) { animation-delay: .14s; }
      .link:nth-child(4) { animation-delay: .21s; }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(12px) scale(.99); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
